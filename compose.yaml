services:
  api:
    # Rebuild from current sources even with plain `docker compose up`.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JANA_KAZAKH_MODEL: ${JANA_KAZAKH_MODEL:-}
      JANA_PROVIDER: ${JANA_PROVIDER:-openai}
      JANA_READER_URL: ${JANA_READER_URL:-http://127.0.0.1:8081}
      JANA_READER_ALLOW_DOCKER_HOST: ${JANA_READER_ALLOW_DOCKER_HOST:-false}
      JANA_READER_MODEL: ${JANA_READER_MODEL:-jana-reader}
      JANA_READER_TIMEOUT_SECONDS: ${JANA_READER_TIMEOUT_SECONDS:-120}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INVITATION_EMAIL_FROM: ${INVITATION_EMAIL_FROM:-PostTech <onboarding@resend.dev>}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      INTEGRATION_1C_ENABLED: ${INTEGRATION_1C_ENABLED:-false}
      INTEGRATION_1C_URL: ${INTEGRATION_1C_URL:-}
      INTEGRATION_1C_SECRET: ${INTEGRATION_1C_SECRET:-}
      INTEGRATION_DOCUMENTOLOG_ENABLED: ${INTEGRATION_DOCUMENTOLOG_ENABLED:-false}
      INTEGRATION_DOCUMENTOLOG_URL: ${INTEGRATION_DOCUMENTOLOG_URL:-}
      INTEGRATION_DOCUMENTOLOG_SECRET: ${INTEGRATION_DOCUMENTOLOG_SECRET:-}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  integrations:
    build: .
    pull_policy: build
    init: true
    command: [python, -m, scripts.background_worker]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      INTEGRATION_1C_ENABLED: ${INTEGRATION_1C_ENABLED:-false}
      INTEGRATION_1C_URL: ${INTEGRATION_1C_URL:-}
      INTEGRATION_1C_SECRET: ${INTEGRATION_1C_SECRET:-}
      INTEGRATION_DOCUMENTOLOG_ENABLED: ${INTEGRATION_DOCUMENTOLOG_ENABLED:-false}
      INTEGRATION_DOCUMENTOLOG_URL: ${INTEGRATION_DOCUMENTOLOG_URL:-}
      INTEGRATION_DOCUMENTOLOG_SECRET: ${INTEGRATION_DOCUMENTOLOG_SECRET:-}
    restart: unless-stopped
    stop_grace_period: 30s
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    pull_policy: build
    ports:
      - "127.0.0.1:${POSTTECH_HTTP_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
