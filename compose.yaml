services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posttech-api
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      JANA_MODEL_DIR: /app/.models/mpnet
      JANA_FAQ_PATH: /app/knowledge_base/faq.json
      JANA_MIN_SCORE: ${JANA_MIN_SCORE:-0.72}
      JANA_SCORE_MARGIN: ${JANA_SCORE_MARGIN:-0.045}
    volumes:
      - ./.models/mpnet:/app/.models/mpnet:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
