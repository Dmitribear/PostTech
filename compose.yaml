name: posttech-local

# Always pass --env-file .local/docker.env. The shared project's .env is not used.
x-api-environment: &api-environment
  SUPABASE_URL: http://supabase:8000
  SUPABASE_KEY: ${POSTTECH_SERVICE_KEY:?Run scripts/prepare_docker.py first}
  SUPABASE_ANON_KEY: ${POSTTECH_ANON_KEY:?Run scripts/prepare_docker.py first}
  JANA_READER_URL: http://jana-reader:8081
  JANA_READER_ALLOW_DOCKER_HOST: "true"
  JANA_READER_MODEL: jana-reader
  JANA_READER_TIMEOUT_SECONDS: "300"
  INTEGRATION_1C_ENABLED: "false"
  INTEGRATION_DOCUMENTOLOG_ENABLED: "false"

services:
  db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: posttech_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTTECH_DB_PASSWORD:?Run scripts/prepare_docker.py first}
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/local/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d posttech_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${POSTTECH_HTTP_PORT:-8000}
      GOTRUE_SITE_URL: http://localhost:${POSTTECH_HTTP_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTTECH_DB_PASSWORD}@db:5432/posttech_local
      GOTRUE_JWT_SECRET: ${POSTTECH_JWT_SECRET:?Run scripts/prepare_docker.py first}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Local demonstration only: no external mail provider or real recipients.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    build: {context: ., dockerfile: Dockerfile, target: bootstrap}
    environment:
      POSTTECH_LOCAL_BOOTSTRAP: "1"
      POSTTECH_DB_PASSWORD: ${POSTTECH_DB_PASSWORD}
      POSTTECH_SERVICE_KEY: ${POSTTECH_SERVICE_KEY}
      POSTTECH_DEMO_PASSWORD: ${POSTTECH_DEMO_PASSWORD:?Run scripts/prepare_docker.py first}
    depends_on:
      auth: {condition: service_healthy}
    networks: [private]
    restart: "no"

  rest:
    image: postgrest/postgrest:v14.18
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTTECH_DB_PASSWORD}@db:5432/posttech_local
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${POSTTECH_JWT_SECRET}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 20

  supabase:
    image: nginx:1.30.6-alpine
    volumes:
      - ./docker/local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8000/healthz]
      interval: 5s
      timeout: 5s
      retries: 10

  model-init:
    build: {context: ., dockerfile: docker/reader/Dockerfile}
    volumes: [jana-models:/models]
    # Only this one-shot downloader has outbound access; inference does not.
    networks: [download]
    restart: "no"

  jana-reader:
    image: ghcr.io/ggml-org/llama.cpp:server-b11669
    command:
      - --model
      - /models/Qwen_Qwen3.5-9B-Q4_K_M.gguf
      - --alias
      - jana-reader
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "${JANA_READER_THREADS:-4}"
      - --threads-batch
      - "${JANA_READER_THREADS:-4}"
      - --gpu-layers
      - "0"
      - --batch-size
      - "256"
      - --ubatch-size
      - "64"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --jinja
      - --reasoning
      - "off"
      - --no-ui
      - --no-agent
      - --no-context-shift
    volumes: [jana-models:/models:ro]
    depends_on:
      model-init: {condition: service_completed_successfully}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/health]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    build: {context: ., dockerfile: Dockerfile, target: api}
    environment: *api-environment
    depends_on:
      supabase: {condition: service_healthy}
      # HR/login stay available while the independent reader warms up.
      jana-reader: {condition: service_started}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  workflow-worker:
    build: {context: ., dockerfile: Dockerfile, target: api}
    command: [python, -m, scripts.workflow_worker]
    environment: *api-environment
    depends_on:
      supabase: {condition: service_healthy}
    networks: [private]
    restart: unless-stopped

  frontend:
    build: {context: ., dockerfile: docker/frontend/Dockerfile}
    ports: ["127.0.0.1:${POSTTECH_HTTP_PORT:-8000}:80"]
    depends_on:
      api: {condition: service_healthy}
    # Docker Desktop needs a normal bridge for host-published ports. Only the
    # reverse proxy joins edge; API, database and model remain internal-only.
    networks: [edge, private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge: {}
  private:
    internal: true
  download: {}

volumes:
  database: {}
  jana-models: {}
