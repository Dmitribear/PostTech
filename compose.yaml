services:
  api:
    # Rebuild from current sources even with plain `docker compose up`.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posttech-api
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      INTEGRATION_1C_ENABLED: ${INTEGRATION_1C_ENABLED:-false}
      INTEGRATION_1C_URL: ${INTEGRATION_1C_URL:-}
      INTEGRATION_1C_SECRET: ${INTEGRATION_1C_SECRET:-}
      INTEGRATION_DOCUMENTOLOG_ENABLED: ${INTEGRATION_DOCUMENTOLOG_ENABLED:-false}
      INTEGRATION_DOCUMENTOLOG_URL: ${INTEGRATION_DOCUMENTOLOG_URL:-}
      INTEGRATION_DOCUMENTOLOG_SECRET: ${INTEGRATION_DOCUMENTOLOG_SECRET:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  workflow-worker:
    build: .
    pull_policy: build
    command: [python, -m, scripts.workflow_worker]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    restart: unless-stopped
    healthcheck:
      disable: true
  integration-worker:
    profiles: [integrations]
    build: .
    command: [python, -m, scripts.integration_worker]
    env_file: .env
    restart: unless-stopped
    healthcheck:
      disable: true
