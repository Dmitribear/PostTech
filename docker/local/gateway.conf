# Internal Supabase SDK endpoint. No host port and no external upstream.
# Docker can assign new addresses after a restart/recreate. Refresh upstream
# DNS instead of retaining the boot-time address until nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream posttech_auth {
    zone posttech_auth 64k;
    server auth:9999 resolve;
}
upstream posttech_rest {
    zone posttech_rest 64k;
    server rest:3000 resolve;
}
server {
    listen 8000;
    server_name _;
    client_max_body_size 12m;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /auth/v1/ {
        proxy_pass http://posttech_auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /rest/v1/ {
        proxy_pass http://posttech_rest/;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
