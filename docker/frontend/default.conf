# Keep API routing correct when Compose recreates the API container.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream posttech_api {
    zone posttech_api 64k;
    server api:8000 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://posttech_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
    }
    location = /openapi.json { proxy_pass http://posttech_api; }
    location /docs { proxy_pass http://posttech_api; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
