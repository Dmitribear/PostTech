<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1050" viewBox="0 0 1520 1050" role="img" aria-labelledby="title desc">
<title id="title">PostTech — архитектура Integration и локальной Jana</title>
<desc id="desc">Работающие React, FastAPI, Supabase, локальная ONNX-модель и FAQ. Справа пунктиром обозначены будущие адаптеры 1С:ЗУП и Documentolog. Google Calendar подключается ручным импортом ICS.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#49705b"/></marker>
  <marker id="future-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#818a99"/></marker>
  <style>
    text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173b2a}
    .heading{font-size:23px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#52665b}
    .node{fill:#fff;stroke:#4b9470;stroke-width:2}.data{fill:#edf4ff;stroke:#6c8cb5;stroke-width:2}
    .future{fill:#fff;stroke:#929baa;stroke-width:2;stroke-dasharray:7 5}
    .edge{fill:none;stroke:#49705b;stroke-width:2;marker-end:url(#arrow)}
    .later{fill:none;stroke:#818a99;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#future-arrow)}
  </style>
</defs>
