<text x="1142" y="591" class="label">Внешний ID и статус обратно</text>
<path class="later" marker-start="url(#future-arrow)" d="M1290 620V670"/>
<rect class="future" x="1120" y="670" width="340" height="95" rx="12"/>
<text x="1142" y="707" class="heading">Documentolog</text>
<text x="1142" y="736" class="label">Кадровый документооборот</text>
<text x="1123" y="807" class="small">Адаптеры пока не реализованы.</text>
<text x="1123" y="832" class="small">В MVP используются тестовые данные.</text>

<rect x="40" y="905" width="1440" height="105" rx="14" fill="#f6f8fb" stroke="#e1e6ed"/>
<text x="65" y="938" class="heading">Границы ИИ</text>
<text x="65" y="968" class="label">Jana не читает персональные сведения и не меняет заявки. Каждый ответ проверяется по цитате и SHA-256 источника.</text>
<text x="65" y="993" class="small">Для Auth и базы нужен интернет. Полная схема доступа, ограничения и будущие контракты — в docs/architecture.md.</text>
